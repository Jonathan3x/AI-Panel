<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,700">
    <link rel="icon" type="image/png" href="./img/ai-icon.png">
    <link rel="stylesheet" href="css/styles.css">
    <title>AI Panel</title>
</head>
<body>
    
    <div class="main mainpanel">

        <div class="panel-graphics">
            <img src="./img/smarthouse.png" class="panel-img" alt="SmartHouse">
            <h2 class="panel-title">Smart Home</h2>
            <ul class="panel-features">
                <li class="panel-features-item">You don't even need to move</li>
                <li class="panel-features-item">Automate</li>
            </ul>
            <span class="pricing">Free Trial</span>
            <a href="#/" class="price-button">Get</a>
        </div>

        <div class="panel-graphics">
            <img src="./img/smartcar.png" class="panel-img" alt="SmartCar">
            <h2 class="panel-title">Smart Car</h2>
            <ul class="panel-features">
                <li class="panel-features-item">Automate</li>
                <li class="panel-features-item">Sef-drive</li>
            </ul>
            <span class="pricing">49.99$</span>
            <a href="#/" class="price-button priceoffer">Free Trial</a>
        </div>

        <div class="panel-graphics">
            <img src="./img/smartpc.png" class="panel-img" alt="SmartPc">
            <h2 class="panel-title">Smart PC</h2>
            <ul class="panel-features">
                <li class="panel-features-item">No need to control</li>
                <li class="panel-features-item">Autotasks</li>
            </ul>
            <span class="pricing">34.99$</span>
            <a href="#/" class="price-button priceoffer">Free trial</a>
        </div>

    </div>
    
</body>
</html>
